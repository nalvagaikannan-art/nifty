<!DOCTYPE html>
<html lang="ta-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}AI NIFTY Analyzer{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NIFTY AI">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<nav class="glass-nav">
    <div class="nav-brand">📊 NIFTY AI</div>
    <ul class="nav-links">
        <li><a href="/dashboard"   id="nav-dashboard">முகப்பு</a></li>
        <li><a href="/live"        id="nav-live">📍 நேரடி பார்வை</a></li>
        <li><a href="/option-view" id="nav-option-view">🎯 ஆப்ஷன் அமைப்பு</a></li>
        <li><a href="/terminal"    id="nav-terminal">⬡ டெர்மினல்</a></li>
        <li><a href="/market"      id="nav-market">சந்தை</a></li>
        <li><a href="/options"     id="nav-options">ஆப்ஷன்கள்</a></li>
        <li><a href="/analysis"    id="nav-analysis">பகுப்பாய்வு</a></li>
        <li><a href="/positions"   id="nav-positions">📊 நிலைகள்</a></li>
        <li><a href="/accuracy"    id="nav-accuracy">🎯 துல்லிய மதிப்பீடு</a></li>
        <li><a href="/call-tracker" id="nav-call-tracker">📋 அழைப்பு கண்காணிப்பு</a></li>
        <li><a href="/pro" id="nav-pro">💎 PRO (SELL/MCX)</a></li>
        <li><a href="/settings"    id="nav-settings">அமைப்புகள்</a></li>
    </ul>
</nav>
<main>
    {% block content %}{% endblock %}
</main>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
<script>
  // Active nav highlight
  (function() {
    var path = location.pathname.replace(/\/$/, '') || '/dashboard';
    var seg = path.split('/')[1] || 'dashboard';
    var el = document.getElementById('nav-' + seg);
    if (el) el.classList.add('active');
  })();
  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
