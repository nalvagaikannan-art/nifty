name: NIFTY-PRO QA Tests

on:
  push:
    branches:
      - nifty-pro-qa
  pull_request:
    branches:
      - nifty-pro-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: nifty-pro-qa
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full test suite
        env:
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
          ALLOW_CRED_WRITE: "0"
          APP_AUTH_USERNAME: qa-user
          APP_AUTH_PASSWORD: qa-only-test-password
        run: |
          python -m pytest -q
