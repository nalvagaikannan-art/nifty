# Pull requests must test GitHub's PR merge commit, not the QA base branch.
name: NIFTY-PRO QA Tests

on:
  push:
    branches:
      - nifty-pro-qa
      - nifty-pro-outcome-grouping
  pull_request:
    branches:
      - nifty-pro-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nifty_qa
          POSTGRES_PASSWORD: nifty_qa_only
          POSTGRES_DB: nifty_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nifty_qa -d nifty_qa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full test suite
        env:
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: "false"
          ALLOW_CRED_WRITE: "0"
          APP_AUTH_USERNAME: qa-user
          APP_AUTH_PASSWORD: qa-only-test-password
          POSTGRES_TEST_URL: postgresql+asyncpg://nifty_qa:nifty_qa_only@127.0.0.1:5432/nifty_qa_test
        run: |
          python -m pytest -q
